<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>catmirror — Control Remoto en Vivo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0B0E14;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    header {
      width: 100%;
      height: 52px;
      background-color: #151C26;
      border-bottom: 1px solid rgba(255, 158, 44, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #FF9E2C;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1E2838;
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-family: monospace;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00E676;
    }
    .stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: calc(100vh - 130px);
      position: relative;
      overflow: hidden;
      padding: 8px;
    }
    .phone-frame {
      position: relative;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(0, 229, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 0.25s ease, height 0.25s ease;
      cursor: grab;
    }
    .phone-frame:active {
      cursor: grabbing;
    }
    #screen-stream {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: auto;
      transition: transform 0.25s ease;
    }
    .bottom-bar {
      height: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: #151C26;
      padding: 0 24px;
      border-radius: 30px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 158, 44, 0.4);
    }
    .nav-btn {
      background: #202B3B;
      color: #FF9E2C;
      font-weight: bold;
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: #FF9E2C;
      color: #000;
    }
    .ripple {
      position: absolute;
      border: 2px solid #00E5FF;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: rippleAnim 0.35s ease-out forwards;
    }
    @keyframes rippleAnim {
      from { width: 4px; height: 4px; opacity: 1; }
      to { width: 40px; height: 40px; opacity: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🐱</span>
      <span>catmirror Control Remoto</span>
    </div>
    <div class="status-pill">
      <div class="dot"></div>
      <span id="host-label">Conectando...</span>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="phone-frame" id="phone-frame">
      <img id="screen-stream" alt="Pantalla remota" src="" draggable="false" />
    </div>
  </div>

  <div style="font-size: 11px; color: #94A3B8; font-family: monospace; margin-bottom: 8px;" id="status-label">Rueda del ratón o arrastrar para scroll • Clic para tocar</div>

  <div class="bottom-bar">
    <button class="nav-btn" id="btn-back">◀ Atrás</button>
    <button class="nav-btn" id="btn-home">⚪ Inicio</button>
    <button class="nav-btn" id="btn-recents">▦ Recientes</button>
    <button class="nav-btn" id="btn-rotate" style="color: #00E5FF;">↻ Rotar (0°)</button>
    <button class="nav-btn" id="btn-dim" style="color: #69F0AE;">🌙 Modo Ahorro</button>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
